# Applique les changements de base de données et redéploie la fonction IA
name: Déployer Supabase
# Lancement manuel (Actions → Déployer Supabase → Run workflow) une fois les 3 secrets Supabase ajoutés.
on:
  workflow_dispatch:
permissions: { contents: read }
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase link --project-ref "$PROJECT_REF"
      - run: supabase db push
      - run: supabase functions deploy ai --project-ref "$PROJECT_REF"
