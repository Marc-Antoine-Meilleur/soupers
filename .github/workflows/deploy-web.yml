# Publie l'application sur GitHub Pages à chaque modification du dossier web/
name: Déployer l'app
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/deploy-web.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Générer les icônes à partir du logo
        working-directory: .
        run: pip install pillow==11.* && python scripts/make_icons.py
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build   # lit web/.env.production
      - uses: actions/upload-pages-artifact@v3
        with: { path: web/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
