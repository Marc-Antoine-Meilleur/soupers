# Garde le projet Supabase gratuit actif (il se met en pause après 7 jours sans activité)
name: Garder actif
on:
  schedule: [{ cron: '17 14 * * 1,4' }]   # lundi et jeudi
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -X POST "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/rpc/ping" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_KEY }}" -H "Content-Type: application/json" -d '{}'
