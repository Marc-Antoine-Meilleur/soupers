# Garde le projet Supabase gratuit actif (il se met en pause après 7 jours sans activité)
name: Garder actif
on:
  schedule: [{ cron: '17 14 * * 1,4' }]   # lundi et jeudi
  workflow_dispatch:
permissions: { contents: read }
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -a; . web/.env.production; set +a
          curl -fsS -X POST "$VITE_SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $VITE_SUPABASE_KEY" -H "Content-Type: application/json" -d '{}'
